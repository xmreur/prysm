name: Build Flutter App

on:
  push:
    tags:
      - 'v*'
    
jobs:

  # ----------------------------
  # Windows build
  # ----------------------------
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: |
          flutter config --enable-windows-desktop
          flutter pub get
      - run: flutter build windows --release
        env:
          CMAKE_POLICY_VERSION_MINIMUM: 3.5

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/

  # ----------------------
  # LINUX BUILD
  # ----------------------
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libsecret-1-dev \
            libayatana-appindicator3-dev \
            libopus0 \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libpulse-dev

      - run: |
          flutter config --enable-linux-desktop
          flutter pub get
      - run: flutter build linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/

  # ----------------------
  # MACOS BUILD
  # ----------------------
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install macOS dependencies
        run: |
          brew install cocoapods opus
          brew link --overwrite cocoapods

      - run: |
          flutter config --enable-macos-desktop
          flutter pub get

      - name: Pod install
        working-directory: macos
        run: pod install

      - run: flutter build macos --release

      - name: Package .app as zip
        run: |
          cd build/macos/Build/Products/Release
          zip -r prysm-macos.zip prysm.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/prysm-macos.zip

  # ----------------------
  # IOS BUILD
  # ----------------------
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install iOS dependencies
        run: |
          brew install cocoapods
          brew link --overwrite cocoapods

      - run: |
          flutter config --enable-swift-package-manager
          flutter pub get

      - name: Prepare Share Extension Swift packages
        run: bash ios/scripts/prepare_share_extension_spm.sh

      - name: Pod install
        working-directory: ios
        run: pod install

      - run: flutter build ios --release --no-codesign

      - name: Package .app as ipa
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r prysm-ios.zip Payload
          mv prysm-ios.zip prysm-ios.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/prysm-ios.ipa

  # ----------------------
  # ANDROID BUILD
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ----------------------
  # PUBLISH GITHUB RELEASE
  # ----------------------
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-linux
      - build-macos
      - build-android
      - build-ios
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release assets
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p release-assets

          cp artifacts/android-apk/app-release.apk "release-assets/Prysm-android-${VERSION}.apk"

          cd artifacts/windows-build
          zip -r "../../release-assets/Prysm-windows-x86_64-${VERSION}.zip" .
          cd ../../

          cd artifacts/linux-build
          zip -r "../../release-assets/Prysm-linux-x86_64-${VERSION}.zip" .
          cd ../../

          unzip -q artifacts/macos-build/prysm-macos.zip -d /tmp/prysm-macos
          cd /tmp/prysm-macos
          zip -r "$GITHUB_WORKSPACE/release-assets/Prysm-macos-${VERSION}.zip" prysm.app

          cp artifacts/ios-build/prysm-ios.ipa "release-assets/Prysm-ios-${VERSION}.ipa"

          # Updater binaries from prysm-auto-updater until built in this repo.
          UPDATER_TAG="v0.0.2"
          BASE="https://github.com/xmreur/prysm-auto-updater/releases/download/${UPDATER_TAG}"
          curl -fsSL -o release-assets/prysm-updater-linux "${BASE}/prysm-updater-linux"
          curl -fsSL -o release-assets/prysm-updater-windows.exe "${BASE}/prysm-updater-windows.exe"
          curl -fsSL -o release-assets/prysm-updater-macos "${BASE}/prysm-updater-macos"
          chmod +x release-assets/prysm-updater-linux release-assets/prysm-updater-macos

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
