name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# The default token is read-write on a repository that has none of it here:
# this job only checks out and runs tests.
permissions:
  contents: read

# Pinned, not tracked: an unpinned `stable` moved 3.44.9 -> 3.47.0 under an
# unchanged main and broke it. Matches both Containerfiles. Bump deliberately.
env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus0

      - name: Install dependencies
        run: flutter pub get

      # Pure-Dart relay packages, resolved and checked BEFORE the root steps:
      # the root `flutter pub get` resolves prysm_relay_protocol as a path dep
      # but writes no `.dart_tool` inside either package, and `flutter analyze`
      # walks their `test/` directories — without their own `dart pub get` it
      # cannot see `package:test` and fails with hundreds of undefined_function
      # errors. prysm_relay_server must never become an app dependency: it is a
      # standalone binary, covered here only by analyze (its tests run in
      # relay.yml, three times on Linux per the race rule).
      # `dart` is the one bundled in the Flutter SDK above: no second toolchain.
      # `--offline` is deliberately absent: CI starts with an empty pub cache.
      - name: Analyze and test relay protocol
        working-directory: packages/prysm_relay_protocol
        run: dart pub get && dart analyze && dart test

      - name: Analyze relay server
        working-directory: packages/prysm_relay_server
        run: dart pub get && dart analyze

      - name: Relay server must never be an app dependency
        run: |
          ! grep -rq "prysm_relay_server" lib test pubspec.yaml

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: L3 harness coverage notice
        run: |
          echo "The real-Tor L3 E2E harness did NOT run in this job."
          echo "It is gated behind PRYSM_E2E=1 (this job runs plain"
          echo "'flutter test', so test/headless_inbound_e2e_test.dart"
          echo "skips here). It must be run locally with .l3e2e/run.sh."
