name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus0

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: L3 harness coverage notice
        run: |
          echo "The real-Tor L3 E2E harness did NOT run in this job."
          echo "It is gated behind PRYSM_E2E=1 (this job runs plain"
          echo "'flutter test', so test/headless_inbound_e2e_test.dart"
          echo "skips here). It must be run locally with .l3e2e/run.sh."
