name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# The toolchain is pinned, not tracked. `channel: stable` alone put CI on
# whatever Flutter shipped that week: 3.44.9 was green on d18d384 and 3.47.0
# failed the identical commit hours later, on a new lint plus a dart:io
# signature change. Both Containerfiles already pin 3.44.8 (host toolchain);
# this is the environment that was drifting away from them. Bump deliberately.
env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus0

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: L3 harness coverage notice
        run: |
          echo "The real-Tor L3 E2E harness did NOT run in this job."
          echo "It is gated behind PRYSM_E2E=1 (this job runs plain"
          echo "'flutter test', so test/headless_inbound_e2e_test.dart"
          echo "skips here). It must be run locally with .l3e2e/run.sh."
